<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>История операций</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4">История операций</h1>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Сотрудник</th>
            <th>Валюта</th>
            <th>Сумма</th>
            <th>Курс</th>
            <th>Получено</th>
            <th>Время</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="operation : ${exchangeOperations}">
            <td th:text="${operation.id}">1</td>
            <td th:text="${operation.employeeId}">Сотрудник</td> <!-- Пока выводится только ID сотрудника -->
            <td th:text="${operation.currencyId}">Валюта</td>    <!-- Пока выводится только ID валюты -->
            <td th:text="${operation.amount}">1000</td>
            <td th:text="${operation.rate}">75.5</td>
            <td th:text="${operation.exchangedAmount}">75500</td>
            <td th:text="${operation.timestamp != null ? operation.timestamp.format(T(java.time.format.DateTimeFormatter).ofPattern('dd.MM.yyyy HH:mm')) : ''}">01.01.2025 12:00</td>
        </tr>
        </tbody>
    </table>

    <div class="mt-4">
        <a href="/" class="btn btn-secondary">На главную</a>
    </div>
</div>

</body>
</html>
