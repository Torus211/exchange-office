    <!DOCTYPE html>
    <html lang="ru" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Обмен валют</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="container mt-5">

    <h1>Операция обмена</h1>

    <!-- Вывод сообщения -->
    <div th:if="${message}" class="alert alert-info">
        <span th:text="${message}"></span>
    </div>

    <!-- Форма для обмена валюты -->
    <form th:action="@{/exchange}" method="post">
        <div class="mb-3">
            <label for="employeeId" class="form-label">Выберите сотрудника</label>
            <select id="employeeId" name="employeeId" class="form-select" required>
                <option th:each="employee : ${employees}"
                        th:value="${employee.id}"
                        th:text="${employee.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="amount" class="form-label">Сумма (в рублях)</label>
            <input type="number" id="amount" name="amount" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="currencyCode" class="form-label">Выберите валюту</label>
            <select id="currencyCode" name="currencyCode" class="form-select" required>
                <option th:each="currency : ${currencies}"
                        th:value="${currency.code}"
                        th:text="${currency.name}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Осуществить обмен</button>
    </form>

    </body>

    </html>
