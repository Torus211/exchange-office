<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сотрудники</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h1 class="mb-4">Список сотрудников</h1>

<!-- Форма добавления нового сотрудника -->
<form th:action="@{/employees}" method="post" class="mb-4">
    <div class="mb-3">
        <label for="name" class="form-label">Имя</label>
        <input type="text" id="name" name="name" class="form-control" required>
        <label for="position" class="form-label">Позиция</label>
        <input type="text" id="position" name="position" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-success">Добавить</button>
</form>

<!-- Таблица сотрудников -->
<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Позиция</th>
        <th>Удаление</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}">1</td>
        <td th:text="${employee.name}">Иван</td>
        <td th:text="${employee.position}">Сотрудник</td>
        <td>
            <form th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
