spring:
  datasource:
    url: jdbc:mysql://localhost:3306/exchange_db?allowPublicKeyRetrieval=true&useSSL=false
    username: toruse
    password: 2660
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10  # Максимальное количество соединений в пуле

  jpa:
    hibernate:
      ddl-auto: update  # Автоматическое создание/обновление схемы
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true  # Добавить комментарии в SQL-запросы

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true  # Если необходимо, чтобы Flyway начинал миграции с определённого базового состояния
    clean-disabled: false  # Если хотите разрешить команду clean (удаляет базу)
    encoding: UTF-8  # Устанавливаем кодировку
